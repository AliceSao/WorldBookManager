<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>配色试行 05 - 混合实验组</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#17181d;color:#e3e6ec}.wrap{max-width:1400px;margin:0 auto;padding:24px}h1{font-size:28px;margin:0 0 8px}p{margin:0 0 24px;color:#a5acb8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px rgba(0,0,0,.38);background:var(--bg)}.head{padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--text);font-weight:700}.body{padding:16px;color:var(--text)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{padding:6px 10px;border-radius:999px;background:var(--tag);color:var(--text2);font-size:12px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.sw{height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-size:13px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);margin-top:10px}.meta{font-size:12px;color:var(--text2);line-height:1.6}</style></head><body><div class="wrap"><h1>配色试行 05：混合实验组</h1><p>偏实验性，适合挑出意外惊喜方向。</p><div class="grid">
<section class="card" style="--bg:#f4f1ec;--surface:#ebe2d7;--surface2:#ddd1c2;--text:#312923;--text2:#75675a;--accent:#8e7c96;--accentText:#fff;--btn:#ece4d9;--tag:#e4d9cc;--input:#faf7f2;--border:rgba(74,60,54,.12)"><div class="head">21 月白金</div><div class="body"><div class="meta">浅底里带一点紫灰，现代和风。</div><div class="chips"><span class="chip">月白</span><span class="chip">紫灰</span></div><div class="swatches"><div class="sw" style="background:#f4f1ec"></div><div class="sw" style="background:#ebe2d7"></div><div class="sw" style="background:#8e7c96"></div><div class="sw" style="background:#312923"></div><div class="sw" style="background:#ddd1c2"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#18151c;--surface:#242033;--surface2:#312b45;--text:#e1dced;--text2:#b0a6c5;--accent:#9d83b8;--accentText:#140f1c;--btn:#211c2c;--tag:#2a2438;--input:#1a1623;--border:rgba(157,131,184,.16)"><div class="head">22 葡萄灰</div><div class="body"><div class="meta">带酒感的灰紫，夜间很耐看。</div><div class="chips"><span class="chip">葡萄</span><span class="chip">灰紫</span></div><div class="swatches"><div class="sw" style="background:#18151c"></div><div class="sw" style="background:#242033"></div><div class="sw" style="background:#9d83b8"></div><div class="sw" style="background:#e1dced"></div><div class="sw" style="background:#312b45"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#10161b;--surface:#18232c;--surface2:#24333f;--text:#d9e4ea;--text2:#9eb0bc;--accent:#7d97a5;--accentText:#0d1418;--btn:#17222a;--tag:#1e2c35;--input:#121b22;--border:rgba(125,151,165,.16)"><div class="head">23 石墨青</div><div class="body"><div class="meta">石墨黑里偏一点青，极简冷淡。</div><div class="chips"><span class="chip">石墨</span><span class="chip">冷淡</span></div><div class="swatches"><div class="sw" style="background:#10161b"></div><div class="sw" style="background:#18232c"></div><div class="sw" style="background:#7d97a5"></div><div class="sw" style="background:#d9e4ea"></div><div class="sw" style="background:#24333f"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#141110;--surface:#221a18;--surface2:#312421;--text:#ead8d2;--text2:#c0a099;--accent:#9e5f57;--accentText:#fff;--btn:#201715;--tag:#2a1d1a;--input:#181210;--border:rgba(158,95,87,.16)"><div class="head">24 乌木红</div><div class="body"><div class="meta">比绛唇更暗更硬朗，偏男性古风。</div><div class="chips"><span class="chip">乌木</span><span class="chip">深红</span></div><div class="swatches"><div class="sw" style="background:#141110"></div><div class="sw" style="background:#221a18"></div><div class="sw" style="background:#9e5f57"></div><div class="sw" style="background:#ead8d2"></div><div class="sw" style="background:#312421"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#11161a;--surface:#182128;--surface2:#23303a;--text:#dfe8ec;--text2:#a4b5be;--accent:#a3b0bf;--accentText:#11161a;--btn:#172027;--tag:#202b34;--input:#131b21;--border:rgba(163,176,191,.16)"><div class="head">25 寒川银</div><div class="body"><div class="meta">最冷、最中性的实验方向，适合极简。</div><div class="chips"><span class="chip">寒银</span><span class="chip">极简</span></div><div class="swatches"><div class="sw" style="background:#11161a"></div><div class="sw" style="background:#182128"></div><div class="sw" style="background:#a3b0bf"></div><div class="sw" style="background:#dfe8ec"></div><div class="sw" style="background:#23303a"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
</div></div></body></html>
