<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Layout Demo 03 - Inspector 抽屉型</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#101318;color:#e7ebf0}.app{display:flex;flex-direction:column;height:100vh}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#131920;border-bottom:1px solid #202a34}.brand{font-weight:700;font-size:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:none;border-radius:10px;padding:8px 12px;background:#1d2731;color:#dce5ee;font-size:13px;cursor:pointer}.btn.primary{background:#4a7f88}.shell{display:grid;grid-template-columns:320px 1fr;flex:1;min-height:0}.left{border-right:1px solid #202a34;background:#12181e;display:flex;flex-direction:column;min-height:0}.main{display:flex;flex-direction:column;min-height:0}.section{padding:14px 16px;border-bottom:1px solid #202a34}.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2a3844;background:#0d1217;color:#dce5ee}.stack{padding:14px;overflow:auto;flex:1}.card{padding:12px 14px;border-radius:12px;background:#182028;border:1px solid #27333d;margin-bottom:8px;cursor:pointer}.card.active{outline:2px solid #4a7f88}.main-toolbar{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid #202a34;background:#11161c;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#1b2630;font-size:12px;color:#a8b6c5;cursor:pointer}.pill.active{background:#4a7f88;color:#fff}.list{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px}.entry{padding:12px 14px;border-radius:12px;background:#172028;border:1px solid #27333d;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.entry-meta{font-size:12px;color:#98aabc}.drawer{position:fixed;top:58px;right:0;width:min(560px,100vw);height:calc(100vh - 58px);background:#0f1419;border-left:1px solid #26323b;box-shadow:-20px 0 50px rgba(0,0,0,.35);display:flex;flex-direction:column}.drawer-head{padding:14px 16px;border-bottom:1px solid #26323b;display:flex;justify-content:space-between;align-items:center}.drawer-body{padding:16px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.label{font-size:12px;color:#9db0c2}.input,.select,.textarea{padding:10px 12px;border-radius:10px;border:1px solid #27333d;background:#121920;color:#e7ebf0}.textarea{min-height:240px;resize:vertical}.footer{height:42px;border-top:1px solid #202a34;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#94a8bb;background:#12181e}@media (max-width:960px){.shell{grid-template-columns:1fr}.left{display:none}.drawer{top:0;height:100vh;width:100vw}.drawer-body{grid-template-columns:1fr}.topbar{height:auto;padding:12px;flex-direction:column;align-items:flex-start;gap:10px}}</style></head><body><div class="app"><div class="topbar"><div class="brand">Layout 03 · Inspector 抽屉型</div><div class="toolbar"><button class="btn primary">💾 保存</button><button class="btn">🔄 刷新</button><button class="btn">📥 导入</button><button class="btn">🎨 主题</button></div></div><div class="shell"><aside class="left"><div class="section"><input class="search" placeholder="搜索世界书..." /></div><div class="stack"><div class="card active" data-wb="无职转生 v2.0">无职转生 v2.0</div><div class="card" data-wb="实教 v2.6">实教 v2.6</div></div></aside><main class="main"><div class="main-toolbar" id="toolbar"><span class="pill active">条目列表模式</span><span class="pill">排序</span><span class="pill">筛选</span><span class="pill">批量UID</span><span class="pill">批量移动</span></div><div class="list" id="entryList"><div class="entry active" data-entry="格式"><div><strong>[0] 格式</strong><div class="entry-meta">🔵 常量 · Order 2</div></div><span class="pill">编辑</span></div><div class="entry" data-entry="AI_guide"><div><strong>[1] AI_guide</strong><div class="entry-meta">🔵 常量 · Order 3</div></div><span class="pill">编辑</span></div><div class="entry" data-entry="时间&地点"><div><strong>[2] 时间&地点</strong><div class="entry-meta">🔵 常量 · Order 5</div></div><span class="pill">编辑</span></div></div></main></div><aside class="drawer"><div class="drawer-head"><strong id="drawerTitle">条目编辑抽屉</strong><button class="btn">⛶ 全屏</button></div><div class="drawer-body"><div class="field"><div class="label">UID</div><input class="input" id="uid" value="0"></div><div class="field"><div class="label">Order</div><input class="input" id="order" value="2"></div><div class="field full"><div class="label">标题</div><input class="input" id="title" value="格式"></div><div class="field full"><div class="label">正文</div><textarea class="textarea" id="content">抽屉型的核心思路是：列表永远稳定，编辑是临时态。
手机上抽屉直接变成全屏页面，最适合小屏设备。</textarea></div></div></aside><div class="footer"><span id="status">优点：手机最好，编辑专注感最强</span><span id="hint">点击左侧世界书/中间条目</span></div></div><script>const map={'格式':[0,2,'格式','抽屉型的核心思路是：列表永远稳定，编辑是临时态。\n手机上抽屉直接变成全屏页面，最适合小屏设备。'],'AI_guide':[1,3,'AI_guide','AI 指引条目示例。'],'时间&地点':[2,5,'时间&地点','时间与地点状态栏条目示例。']};document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{document.querySelectorAll('.card').forEach(n=>n.classList.remove('active'));el.classList.add('active');status.textContent='当前世界书：'+el.dataset.wb;});document.querySelectorAll('#entryList .entry').forEach(el=>el.onclick=()=>{document.querySelectorAll('#entryList .entry').forEach(n=>n.classList.remove('active'));el.classList.add('active');const d=map[el.dataset.entry];uid.value=d[0];order.value=d[1];title.value=d[2];content.value=d[3];drawerTitle.textContent='条目编辑抽屉 · '+d[2];status.textContent='当前条目：'+d[2];});document.querySelectorAll('.pill,.toolbar .btn').forEach(el=>el.onclick=()=>{if(el.parentElement&&el.parentElement.id==='toolbar'){document.querySelectorAll('#toolbar .pill').forEach(n=>n.classList.remove('active'));el.classList.add('active');} hint.textContent='已点击：'+el.textContent;});</script></body></html>
