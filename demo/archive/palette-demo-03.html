<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>配色试行 03 - 古风暖色组</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#1a1210;color:#f0ddd6}.wrap{max-width:1400px;margin:0 auto;padding:24px}h1{font-size:28px;margin:0 0 8px}p{margin:0 0 24px;color:#c0a49a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px rgba(0,0,0,.38);background:var(--bg)}.head{padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--text);font-weight:700}.body{padding:16px;color:var(--text)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{padding:6px 10px;border-radius:999px;background:var(--tag);color:var(--text2);font-size:12px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.sw{height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-size:13px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);margin-top:10px}.meta{font-size:12px;color:var(--text2);line-height:1.6}</style></head><body><div class="wrap"><h1>配色试行 03：古风暖色组</h1><p>偏绛红、金泥、秋灯、琥珀。中式古风和宴席灯火感。</p><div class="grid">
<section class="card" style="--bg:#160d0d;--surface:#261515;--surface2:#351f1f;--text:#ecd7d2;--text2:#c6a29a;--accent:#c37878;--accentText:#170c0c;--btn:#241313;--tag:#2c1818;--input:#1a0f0f;--border:rgba(195,120,120,.14)"><div class="head">11 流苏·绛唇</div><div class="body"><div class="meta">绛红主色，偏古典闺阁和绣帘感。</div><div class="chips"><span class="chip">绛红</span><span class="chip">古典</span></div><div class="swatches"><div class="sw" style="background:#160d0d"></div><div class="sw" style="background:#261515"></div><div class="sw" style="background:#c37878"></div><div class="sw" style="background:#ecd7d2"></div><div class="sw" style="background:#351f1f"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#171210;--surface:#28211c;--surface2:#3a3028;--text:#efe2d6;--text2:#cfb79f;--accent:#d2a75f;--accentText:#19120d;--btn:#241d18;--tag:#2b241e;--input:#1c1612;--border:rgba(210,167,95,.16)"><div class="head">12 金泥宴火</div><div class="body"><div class="meta">金泥色更强，适合“贵气”但不俗。</div><div class="chips"><span class="chip">金泥</span><span class="chip">宴火</span></div><div class="swatches"><div class="sw" style="background:#171210"></div><div class="sw" style="background:#28211c"></div><div class="sw" style="background:#d2a75f"></div><div class="sw" style="background:#efe2d6"></div><div class="sw" style="background:#3a3028"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#1b1110;--surface:#2a1917;--surface2:#3b2420;--text:#f1dbd2;--text2:#cb9e90;--accent:#d98978;--accentText:#220f0c;--btn:#281614;--tag:#301b18;--input:#1d1210;--border:rgba(217,137,120,.16)"><div class="head">13 胭脂秋灯</div><div class="body"><div class="meta">偏暖橙红，灯笼和胭脂感更明显。</div><div class="chips"><span class="chip">灯火</span><span class="chip">暖红</span></div><div class="swatches"><div class="sw" style="background:#1b1110"></div><div class="sw" style="background:#2a1917"></div><div class="sw" style="background:#d98978"></div><div class="sw" style="background:#f1dbd2"></div><div class="sw" style="background:#3b2420"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#19130f;--surface:#2b2117;--surface2:#3d2e21;--text:#f0dfcf;--text2:#c7aa8d;--accent:#c89b64;--accentText:#1a130d;--btn:#271d16;--tag:#2f241b;--input:#1d1611;--border:rgba(200,155,100,.15)"><div class="head">14 琥珀茶烟</div><div class="body"><div class="meta">茶与琥珀，古卷与木器质感。</div><div class="chips"><span class="chip">琥珀</span><span class="chip">木质</span></div><div class="swatches"><div class="sw" style="background:#19130f"></div><div class="sw" style="background:#2b2117"></div><div class="sw" style="background:#c89b64"></div><div class="sw" style="background:#f0dfcf"></div><div class="sw" style="background:#3d2e21"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#140f11;--surface:#24191d;--surface2:#35252c;--text:#edd9df;--text2:#c5a0ae;--accent:#b96f8a;--accentText:#180e11;--btn:#21161a;--tag:#2a1b21;--input:#181114;--border:rgba(185,111,138,.15)"><div class="head">15 霞绯罗幕</div><div class="body"><div class="meta">偏酒红粉，适合更女性向和华丽方向。</div><div class="chips"><span class="chip">绯色</span><span class="chip">罗幕</span></div><div class="swatches"><div class="sw" style="background:#140f11"></div><div class="sw" style="background:#24191d"></div><div class="sw" style="background:#b96f8a"></div><div class="sw" style="background:#edd9df"></div><div class="sw" style="background:#35252c"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
</div></div></body></html>
