<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>二次筛选 02 - 深海夜色</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0d1117;color:#d8e4ef}.wrap{max-width:1280px;margin:0 auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px rgba(0,0,0,.38);background:var(--bg)}.head{padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--text);font-weight:700}.body{padding:16px;color:var(--text)}.meta{font-size:12px;color:var(--text2);line-height:1.7}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.sw{height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:6px 10px;border-radius:999px;background:var(--tag);color:var(--text2);font-size:12px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-size:13px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);margin-top:12px}</style></head><body><div class="wrap"><h1>二次筛选 02：深海夜色组</h1><p>主体：月下群青 + 墨海听潮。融合海月银蓝、玄夜靛紫、深海潮汐的层次。</p><div class="grid">
<section class="card" style="--bg:#11172a;--surface:#1a2140;--surface2:#252f53;--text:#d9ddf0;--text2:#a3a8c9;--accent:#bea56a;--accentText:#141014;--btn:#1d2444;--tag:#252d51;--input:#151b31;--border:rgba(190,165,106,.16)"><div class="head">B1 月下群青·金砂</div><div class="body"><div class="meta">月下群青为主，保留金色点睛，但金色压暗一档，避免浮夸。适合你想要的“夜色+古风贵气”。</div><div class="chips"><span class="chip">深色</span><span class="chip">群青</span><span class="chip">古金</span></div><div class="swatches"><div class="sw" style="background:#11172a"></div><div class="sw" style="background:#1a2140"></div><div class="sw" style="background:#bea56a"></div><div class="sw" style="background:#d9ddf0"></div><div class="sw" style="background:#252f53"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#0b1420;--surface:#102231;--surface2:#173547;--text:#d4e3ee;--text2:#95afc1;--accent:#57aeb6;--accentText:#0a1318;--btn:#112535;--tag:#173040;--input:#0f1b28;--border:rgba(87,174,182,.16)"><div class="head">B2 墨海听潮·海月</div><div class="body"><div class="meta">墨海听潮为主，吸收海月银蓝的冷感，让蓝绿更透气，适合长时间盯屏看。</div><div class="chips"><span class="chip">深海</span><span class="chip">蓝绿</span><span class="chip">冷静</span></div><div class="swatches"><div class="sw" style="background:#0b1420"></div><div class="sw" style="background:#102231"></div><div class="sw" style="background:#57aeb6"></div><div class="sw" style="background:#d4e3ee"></div><div class="sw" style="background:#173547"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
</div></div></body></html>
