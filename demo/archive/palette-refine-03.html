<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>二次筛选 03 - 古风暖色</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#1b1310;color:#f0ddd2}.wrap{max-width:1280px;margin:0 auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px rgba(0,0,0,.38);background:var(--bg)}.head{padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--text);font-weight:700}.body{padding:16px;color:var(--text)}.meta{font-size:12px;color:var(--text2);line-height:1.7}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.sw{height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:6px 10px;border-radius:999px;background:var(--tag);color:var(--text2);font-size:12px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-size:13px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);margin-top:12px}</style></head><body><div class="wrap"><h1>二次筛选 03：古风暖色组</h1><p>主体：金泥宴火 + 琥珀茶烟。融合绛唇、胭脂秋灯、霞绯罗幕的暖度。</p><div class="grid">
<section class="card" style="--bg:#17120e;--surface:#281f18;--surface2:#3a2e24;--text:#f0dfcf;--text2:#c9ab8e;--accent:#cfa45f;--accentText:#1b140d;--btn:#261d17;--tag:#2f241c;--input:#1c1611;--border:rgba(207,164,95,.16)"><div class="head">C1 金泥宴火·秋筵</div><div class="body"><div class="meta">以金泥宴火为主，但把胭脂秋灯的一点暖红埋在阴影里，显得更像夜宴烛光。</div><div class="chips"><span class="chip">金泥</span><span class="chip">宴火</span><span class="chip">古风</span></div><div class="swatches"><div class="sw" style="background:#17120e"></div><div class="sw" style="background:#281f18"></div><div class="sw" style="background:#cfa45f"></div><div class="sw" style="background:#f0dfcf"></div><div class="sw" style="background:#3a2e24"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#18120f;--surface:#261d17;--surface2:#35271f;--text:#eedbcc;--text2:#c2a48a;--accent:#bd9060;--accentText:#1a120d;--btn:#241b15;--tag:#2c211a;--input:#1c1511;--border:rgba(189,144,96,.16)"><div class="head">C2 琥珀茶烟·绯幕</div><div class="body"><div class="meta">以琥珀茶烟为骨架，吸收绛唇与霞绯罗幕的少量红感，让暖色更有层次，不只是“黄”。</div><div class="chips"><span class="chip">琥珀</span><span class="chip">茶烟</span><span class="chip">暖棕</span></div><div class="swatches"><div class="sw" style="background:#18120f"></div><div class="sw" style="background:#261d17"></div><div class="sw" style="background:#bd9060"></div><div class="sw" style="background:#eedbcc"></div><div class="sw" style="background:#35271f"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
</div></div></body></html>
