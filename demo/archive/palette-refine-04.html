<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>二次筛选 04 - 森林自然</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101611;color:#d7e2d8}.wrap{max-width:1280px;margin:0 auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px rgba(0,0,0,.38);background:var(--bg)}.head{padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--text);font-weight:700}.body{padding:16px;color:var(--text)}.meta{font-size:12px;color:var(--text2);line-height:1.7}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.sw{height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:6px 10px;border-radius:999px;background:var(--tag);color:var(--text2);font-size:12px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-size:13px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);margin-top:12px}</style></head><body><div class="wrap"><h1>二次筛选 04：森林自然组</h1><p>主体：竹露晨青 + 杉青寒岚。融合森林绿、苔庭雨声、雾森听风。</p><div class="grid">
<section class="card" style="--bg:#101914;--surface:#18261d;--surface2:#22352a;--text:#d7e4d8;--text2:#9fb7a1;--accent:#8db98a;--accentText:#101611;--btn:#17241b;--tag:#1f2f24;--input:#121d16;--border:rgba(141,185,138,.15)"><div class="head">D1 竹露晨青·雾岚</div><div class="body"><div class="meta">竹露晨青为主，加入雾森的冷调和森林绿的深度，更适合“自然但不灰”。</div><div class="chips"><span class="chip">竹青</span><span class="chip">自然</span><span class="chip">清新</span></div><div class="swatches"><div class="sw" style="background:#101914"></div><div class="sw" style="background:#18261d"></div><div class="sw" style="background:#8db98a"></div><div class="sw" style="background:#d7e4d8"></div><div class="sw" style="background:#22352a"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#111918;--surface:#182320;--surface2:#22312d;--text:#d8e4e1;--text2:#9db2ac;--accent:#668d84;--accentText:#f6faf9;--btn:#17211f;--tag:#1f2b28;--input:#121918;--border:rgba(102,141,132,.16)"><div class="head">D2 杉青寒岚·苔影</div><div class="body"><div class="meta">杉青寒岚为主，吸收苔庭雨声的灰度，适合你如果想要更沉静、更克制的自然系。</div><div class="chips"><span class="chip">杉青</span><span class="chip">寒岚</span><span class="chip">克制</span></div><div class="swatches"><div class="sw" style="background:#111918"></div><div class="sw" style="background:#182320"></div><div class="sw" style="background:#668d84"></div><div class="sw" style="background:#d8e4e1"></div><div class="sw" style="background:#22312d"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
</div></div></body></html>
