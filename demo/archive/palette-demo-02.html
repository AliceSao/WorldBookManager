<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>配色试行 02 - 深海夜色组</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0a1118;color:#d8e4ef}.wrap{max-width:1400px;margin:0 auto;padding:24px}h1{font-size:28px;margin:0 0 8px}p{margin:0 0 24px;color:#8ea2b3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px rgba(0,0,0,.38);background:var(--bg)}.head{padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--text);font-weight:700}.body{padding:16px;color:var(--text)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{padding:6px 10px;border-radius:999px;background:var(--tag);color:var(--text2);font-size:12px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.sw{height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-size:13px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);margin-top:10px}.meta{font-size:12px;color:var(--text2);line-height:1.6}</style></head><body><div class="wrap"><h1>配色试行 02：深海夜色组</h1><p>偏深海、群青、夜色、月面反光。适合深色主题。</p><div class="grid">
<section class="card" style="--bg:#0d1826;--surface:#13253b;--surface2:#1a314d;--text:#d4e4ef;--text2:#97b2c7;--accent:#63c2c7;--accentText:#0b1822;--btn:#142738;--tag:#183042;--input:#101f30;--border:rgba(99,194,199,.14)"><div class="head">06 深海·潮汐</div><div class="body"><div class="meta">主色偏蓝绿，强调夜海荧光感。</div><div class="chips"><span class="chip">深海</span><span class="chip">青蓝</span></div><div class="swatches"><div class="sw" style="background:#0d1826"></div><div class="sw" style="background:#13253b"></div><div class="sw" style="background:#63c2c7"></div><div class="sw" style="background:#d4e4ef"></div><div class="sw" style="background:#1a314d"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#12162a;--surface:#1b2140;--surface2:#262d54;--text:#d8ddf0;--text2:#9ba6ca;--accent:#c3b070;--accentText:#18151a;--btn:#1f2546;--tag:#252d52;--input:#151a33;--border:rgba(195,176,112,.16)"><div class="head">07 月下群青</div><div class="body"><div class="meta">更偏紫蓝夜空，金色做点缀。</div><div class="chips"><span class="chip">群青</span><span class="chip">月光</span></div><div class="swatches"><div class="sw" style="background:#12162a"></div><div class="sw" style="background:#1b2140"></div><div class="sw" style="background:#c3b070"></div><div class="sw" style="background:#d8ddf0"></div><div class="sw" style="background:#262d54"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#0f1721;--surface:#14202d;--surface2:#1f2f40;--text:#d8e6ef;--text2:#9eb2bf;--accent:#7ac0e6;--accentText:#10202c;--btn:#162534;--tag:#1b2c3d;--input:#111c29;--border:rgba(122,192,230,.14)"><div class="head">08 海月银蓝</div><div class="body"><div class="meta">更冷，更偏银蓝，适合科技感一点的古风。</div><div class="chips"><span class="chip">冷调</span><span class="chip">银蓝</span></div><div class="swatches"><div class="sw" style="background:#0f1721"></div><div class="sw" style="background:#14202d"></div><div class="sw" style="background:#7ac0e6"></div><div class="sw" style="background:#d8e6ef"></div><div class="sw" style="background:#1f2f40"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#111421;--surface:#1a1f34;--surface2:#252b45;--text:#dedff0;--text2:#a4a8c8;--accent:#8b95d8;--accentText:#111526;--btn:#1e2440;--tag:#252d4a;--input:#151a2e;--border:rgba(139,149,216,.16)"><div class="head">09 玄夜靛紫</div><div class="body"><div class="meta">靛紫夜色，柔一点的二次元和风方向。</div><div class="chips"><span class="chip">靛紫</span><span class="chip">夜色</span></div><div class="swatches"><div class="sw" style="background:#111421"></div><div class="sw" style="background:#1a1f34"></div><div class="sw" style="background:#8b95d8"></div><div class="sw" style="background:#dedff0"></div><div class="sw" style="background:#252b45"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#0b1320;--surface:#102033;--surface2:#163049;--text:#d1e2ee;--text2:#8faac1;--accent:#4fb0b8;--accentText:#08161b;--btn:#122438;--tag:#173044;--input:#0d1c2d;--border:rgba(79,176,184,.16)"><div class="head">10 墨海听潮</div><div class="body"><div class="meta">更暗的深海版，偏成熟沉稳。</div><div class="chips"><span class="chip">成熟</span><span class="chip">墨蓝</span></div><div class="swatches"><div class="sw" style="background:#0b1320"></div><div class="sw" style="background:#102033"></div><div class="sw" style="background:#4fb0b8"></div><div class="sw" style="background:#d1e2ee"></div><div class="sw" style="background:#163049"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
</div></div></body></html>
