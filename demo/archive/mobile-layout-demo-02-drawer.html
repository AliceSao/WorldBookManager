<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Mobile Demo 02 - 列表优先+抽屉编辑</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#f5f1ea;color:#2f261f}.app{height:100vh;height:100dvh;display:flex;flex-direction:column}.top{padding:14px 16px;border-bottom:1px solid rgba(60,40,20,.08);background:#faf6ef}.title{font-size:18px;font-weight:700}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid rgba(60,40,20,.1);border-radius:10px;padding:8px 12px;background:#efe6d8;color:#3a2a1c;font-size:13px;cursor:pointer}.btn.primary{background:#7b6d89;color:#fff;border-color:transparent}.content{flex:1;overflow:auto;padding:14px}.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(60,40,20,.12);background:#fff;color:#2f261f;margin-bottom:12px}.row{padding:12px 14px;border-radius:12px;background:#fff;border:1px solid rgba(60,40,20,.08);margin-bottom:10px;cursor:pointer}.row.active{outline:2px solid #7b6d89}.meta{font-size:12px;color:#7b6a5d;margin-top:6px}.drawer{position:fixed;left:0;right:0;bottom:0;height:78vh;background:#fff;border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -16px 40px rgba(0,0,0,.18);padding:16px;display:flex;flex-direction:column}.grab{width:48px;height:5px;border-radius:999px;background:#d7cec0;margin:0 auto 12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.label{font-size:12px;color:#7b6a5d}.input,.textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(60,40,20,.12);background:#fff;color:#2f261f}.textarea{flex:1;min-height:180px;resize:none}</style></head><body><div class="app"><div class="top"><div class="title">Mobile 02 · 列表优先 + 抽屉编辑</div><div class="tools"><button class="btn">📚 世界书</button><button class="btn">🔄 刷新</button><button class="btn">🎨 主题</button><button class="btn primary">💾 保存</button></div></div><div class="content"><input class="search" placeholder="搜索条目..." /><div class="row active">[0] 格式<div class="meta">🔵 常量 · Order 2 · 点我切换编辑对象</div></div><div class="row">[1] AI_guide<div class="meta">🔵 常量 · Order 3</div></div><div class="row">[2] 时间&地点<div class="meta">🔵 常量 · Order 5</div></div><div class="row">[3] 公告栏<div class="meta">🔵 常量 · Order 7</div></div></div><div class="drawer"><div class="grab"></div><div class="field"><div class="label">标题</div><input class="input" value="格式"></div><div class="field"><div class="label">快捷操作</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">⬆ 上移</button><button class="btn">⬇ 下移</button><button class="btn">UID重排</button><button class="btn">🔵 常量</button></div></div><div class="field" style="flex:1"><div class="label">正文</div><textarea class="textarea">这是抽屉式编辑。核心思想：手机上“先看列表，再拉起编辑器”。

优点是世界书和条目操作不需要一直跟编辑器一起显示，减少挤压。</textarea></div></div></div></body></html>
