<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Mobile Demo 03 - 步骤流</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#101318;color:#e7ebf0}.app{min-height:100vh;background:#101318}.top{padding:16px;border-bottom:1px solid #202a34;background:#141a20}.title{font-size:18px;font-weight:700}.stepbar{display:flex;gap:8px;margin-top:12px;overflow:auto}.step{padding:8px 12px;border-radius:999px;background:#1c2630;color:#9db0c2;font-size:12px;white-space:nowrap;cursor:pointer}.step.active{background:#4a7f88;color:#fff}.content{padding:16px}.panel{display:none}.panel.active{display:block}.card{padding:14px;border-radius:14px;background:#172028;border:1px solid #27333d;margin-bottom:10px}.search,.input,.textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #27333d;background:#121920;color:#e7ebf0}.textarea{min-height:220px;resize:vertical}.btn{border:none;border-radius:10px;padding:9px 12px;background:#1d2731;color:#dce5ee;font-size:13px;cursor:pointer}.btn.primary{background:#4a7f88}.group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.footer{position:sticky;bottom:0;background:#141a20;border-top:1px solid #202a34;padding:12px 16px;display:flex;justify-content:space-between;gap:8px}</style></head><body><div class="app"><div class="top"><div class="title">Mobile 03 · 步骤流布局</div><div class="stepbar" id="steps"><div class="step active" data-target="s1">1 世界书</div><div class="step" data-target="s2">2 条目</div><div class="step" data-target="s3">3 操作</div><div class="step" data-target="s4">4 编辑</div></div></div><div class="content"><section class="panel active" id="s1"><input class="search" placeholder="搜索世界书..." /><div class="card">无职转生 v2.0</div><div class="card">实教 v2.6</div><div class="group"><button class="btn">📥 导入</button><button class="btn">📤 导出</button><button class="btn">📋 复制</button></div></section><section class="panel" id="s2"><input class="search" placeholder="搜索条目..." /><div class="card">[0] 格式</div><div class="card">[1] AI_guide</div><div class="card">[2] 时间&地点</div></section><section class="panel" id="s3"><div class="group"><button class="btn">自定义排序</button><button class="btn">优先级</button><button class="btn">UID重排</button></div><div class="group"><button class="btn">🔵 常量</button><button class="btn">🔤 关键字</button><button class="btn">⬆ 上移</button><button class="btn">⬇ 下移</button></div></section><section class="panel" id="s4"><div class="card"><div style="font-size:12px;color:#9db0c2;margin-bottom:8px">标题</div><input class="input" value="格式"></div><div class="card"><div style="font-size:12px;color:#9db0c2;margin-bottom:8px">正文</div><textarea class="textarea">步骤流的优点是：用户永远只处理当前步骤，不会被所有功能同时压住。

缺点是切换成本更高，不适合频繁对比。</textarea></div></section></div><div class="footer"><button class="btn">🔄 刷新</button><button class="btn">🎨 主题</button><button class="btn primary">💾 保存</button></div></div><script>document.querySelectorAll('#steps .step').forEach(t=>t.onclick=()=>{document.querySelectorAll('#steps .step').forEach(n=>n.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(t.dataset.target).classList.add('active');});</script></body></html>
