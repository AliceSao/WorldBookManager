<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>配色试行 04 - 森林自然组</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0f1512;color:#d8e3d9}.wrap{max-width:1400px;margin:0 auto;padding:24px}h1{font-size:28px;margin:0 0 8px}p{margin:0 0 24px;color:#98ad9c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px rgba(0,0,0,.38);background:var(--bg)}.head{padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--text);font-weight:700}.body{padding:16px;color:var(--text)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{padding:6px 10px;border-radius:999px;background:var(--tag);color:var(--text2);font-size:12px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.sw{height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-size:13px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);margin-top:10px}.meta{font-size:12px;color:var(--text2);line-height:1.6}</style></head><body><div class="wrap"><h1>配色试行 04：森林自然组</h1><p>偏苔藓、竹露、杉青、雾森，自然静谧。</p><div class="grid">
<section class="card" style="--bg:#0f1913;--surface:#17261c;--surface2:#203327;--text:#d6e3d6;--text2:#9eb79f;--accent:#7bb27d;--accentText:#0e1610;--btn:#15231a;--tag:#1b2d22;--input:#111d15;--border:rgba(123,178,125,.15)"><div class="head">16 森林绿</div><div class="body"><div class="meta">接近你给的深色森林绿，但更柔和。</div><div class="chips"><span class="chip">森林</span><span class="chip">深绿</span></div><div class="swatches"><div class="sw" style="background:#0f1913"></div><div class="sw" style="background:#17261c"></div><div class="sw" style="background:#7bb27d"></div><div class="sw" style="background:#d6e3d6"></div><div class="sw" style="background:#203327"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#111a15;--surface:#1a281f;--surface2:#24352a;--text:#d8e5d9;--text2:#9db49f;--accent:#92c28a;--accentText:#0f1711;--btn:#17251c;--tag:#1e2d23;--input:#121d17;--border:rgba(146,194,138,.15)"><div class="head">17 竹露晨青</div><div class="body"><div class="meta">更明亮一点的竹叶和露水感。</div><div class="chips"><span class="chip">竹露</span><span class="chip">清晨</span></div><div class="swatches"><div class="sw" style="background:#111a15"></div><div class="sw" style="background:#1a281f"></div><div class="sw" style="background:#92c28a"></div><div class="sw" style="background:#d8e5d9"></div><div class="sw" style="background:#24352a"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#121715;--surface:#1b231f;--surface2:#28322d;--text:#d9e1dc;--text2:#a0aea8;--accent:#84a194;--accentText:#0f1311;--btn:#18211d;--tag:#1f2a24;--input:#131916;--border:rgba(132,161,148,.15)"><div class="head">18 苔庭雨声</div><div class="body"><div class="meta">更灰，更安静，更适合中性向。</div><div class="chips"><span class="chip">苔藓</span><span class="chip">灰绿</span></div><div class="swatches"><div class="sw" style="background:#121715"></div><div class="sw" style="background:#1b231f"></div><div class="sw" style="background:#84a194"></div><div class="sw" style="background:#d9e1dc"></div><div class="sw" style="background:#28322d"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#0e1817;--surface:#162423;--surface2:#203130;--text:#d4e4df;--text2:#98b8af;--accent:#71b3a6;--accentText:#0d1614;--btn:#152321;--tag:#1b2d2a;--input:#101c1a;--border:rgba(113,179,166,.15)"><div class="head">19 雾森听风</div><div class="body"><div class="meta">偏冷绿松石，接近山雾里的植物。</div><div class="chips"><span class="chip">雾森</span><span class="chip">冷绿</span></div><div class="swatches"><div class="sw" style="background:#0e1817"></div><div class="sw" style="background:#162423"></div><div class="sw" style="background:#71b3a6"></div><div class="sw" style="background:#d4e4df"></div><div class="sw" style="background:#203130"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#101817;--surface:#172321;--surface2:#21312e;--text:#d7e4e1;--text2:#9fb5af;--accent:#5f8c84;--accentText:#f4f7f6;--btn:#162220;--tag:#1d2b28;--input:#111a18;--border:rgba(95,140,132,.16)"><div class="head">20 杉青寒岚</div><div class="body"><div class="meta">压低饱和度的杉木青，更耐看。</div><div class="chips"><span class="chip">杉青</span><span class="chip">沉稳</span></div><div class="swatches"><div class="sw" style="background:#101817"></div><div class="sw" style="background:#172321"></div><div class="sw" style="background:#5f8c84"></div><div class="sw" style="background:#d7e4e1"></div><div class="sw" style="background:#21312e"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
</div></div></body></html>
