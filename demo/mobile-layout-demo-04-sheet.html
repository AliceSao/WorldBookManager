<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Mobile Demo 04 - 单列卡片 + 底部抽屉</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#f5f0e8;color:#2d261f}.app{min-height:100vh;padding-bottom:82px}.top{padding:16px;border-bottom:1px solid rgba(60,40,20,.08);background:#faf6ef}.title{font-size:18px;font-weight:700}.sub{margin-top:6px;font-size:12px;color:#7b6a5d}.content{padding:16px}.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(60,40,20,.12);background:#fff;color:#2f261f;margin-bottom:12px}.card{padding:14px;border-radius:14px;background:#fff;border:1px solid rgba(60,40,20,.08);margin-bottom:12px}.meta{font-size:12px;color:#7b6a5d;margin-top:6px}.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tag{padding:6px 10px;border-radius:999px;background:#efe6d8;font-size:12px;color:#6b5b4d;cursor:pointer}.sheet{position:fixed;left:0;right:0;bottom:0;background:#fbf8f3;border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid rgba(60,40,20,.08);box-shadow:0 -12px 28px rgba(0,0,0,.12)}.sheet-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.sheet-tabs{display:flex;gap:8px;padding:0 16px 12px}.pill{padding:7px 10px;border-radius:999px;background:#efe6d8;font-size:12px;color:#6b5b4d;cursor:pointer}.pill.active{background:#7b6d89;color:#fff}.actions{padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid rgba(60,40,20,.1);border-radius:10px;padding:9px 12px;background:#f6efe4;color:#3a2a1c;font-size:13px;cursor:pointer}.btn.primary{background:#7b6d89;color:#fff;border-color:transparent}</style></head><body><div class="app"><div class="top"><div class="title">Mobile 04 · 单列卡片 + 底部抽屉</div><div class="sub">整个页面只保留阅读和浏览，操作收进底部抽屉。</div></div><div class="content"><input class="search" placeholder="搜索世界书 / 条目..." /><div
