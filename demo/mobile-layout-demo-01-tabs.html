<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Mobile Demo 01 - 底部标签栏</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#0f1418;color:#e8edf2}.app{display:flex;flex-direction:column;height:100vh;height:100dvh}.top{padding:14px 16px;border-bottom:1px solid #1f2a33;background:#131920}.title{font-size:18px;font-weight:700}.sub{font-size:12px;color:#91a4b5;margin-top:4px}.content{flex:1;overflow:auto;padding:14px}.panel{display:none}.panel.active{display:block}.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #25313b;background:#0d1216;color:#dce4ec;margin-bottom:12px}.card{padding:12px 14px;border-radius:12px;background:#172028;border:1px solid #23303a;margin-bottom:10px;cursor:pointer}.card.active{outline:2px solid #4a8c82}.meta{font-size:12px;color:#91a4b5;margin-top:6px}.btn{border:none;border-radius:10px;padding:9px 12px;background:#1d2731;color:#dce5ee;font-size:13px;cursor:pointer}.btn.primary{background:#3f7b72}.group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.textarea,.input,.select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #23303a;background:#121920;color:#e8edf2}.textarea{min-height:200px;resize:vertical}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.label{font-size:12px;color:#9fb2c4}.tabs{height:58px;border-top:1px solid #1f2a33;display:grid;grid-template-columns:repeat(4,1fr);background:#131920}.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#91a4b5;font-size:11px;cursor:pointer}.tab.active{color:#7fc5b9}.fab{position:fixed;right:16px;bottom:72px;width:52px;height:52px;border-radius:50%;border:none;background:#3f7b72;color:#fff;font-size:22px;box-shadow:0 10px 24px rgba(0,0,0,.35)}</style></head><body><div class="app"><div class="top"><div class="title">Mobile 01 · 底部标签栏</div><div class="sub">适合“先看，再切，再编辑”</div></div><div class="content"><section class="panel active" id="p1"><input class="search" placeholder="搜索世界书..." /><div class="card active">无职转生 v2.0<div class="meta">📥 导入 · 📤 导出 · 📋 复制 · ✏️ 改名 · 🗑️ 删除</div></div><div class="card">实教 v2.6</div></section><section class="panel" id="p2"><input class="search" placeholder="搜索条目..." /><div class="group"><button class="btn">自定义</button><button class="btn">UID</button><button class="btn">优先级</button></div><div class="card active">[0] 格式<div class="meta">🔵 常量 · Order 2</div></div><div class="card">[1] AI_guide<div class="meta">🔵 常量 · Order 3</div></div></section><section class="panel" id="p3"><div class="group"><button class="btn">⬆ 上移</button><button class="btn">⬇ 下移</button><button class="btn">UID重排</button></div><div class="group"><button class="btn">🔵 常量</button><button class="btn">🔤 关键字</button><button class="btn">📋 复制</button></div></section><section class="panel" id="p4"><div class="field"><div class="label">UID</div><input class="input" value="0"></div><div class="field"><div class="label">标题</div><input class="input" value="格式"></div><div class="field"><div class="label">正文</div><textarea class="textarea">这里是全屏编辑区。
手机上把编辑当成一个独立 tab，会比挤在列表里舒服很多。</textarea></div><button class="btn primary">💾 保存</button></section></div><button class="fab">✎</button><div class="tabs" id="tabs"><div class="tab active" data-target="p1">📚<span>世界书</span></div><div class="tab" data-target="p2">🧾<span>条目</span></div><div class="tab" data-target="p3">🧰<span>操作</span></div><div class="tab" data-target="p4">✏️<span>编辑</span></div></div></div><script>document.querySelectorAll('#tabs .tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('#tabs .tab').forEach(n=>n.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(t.dataset.target).classList.add('active');});</script></body></html>
