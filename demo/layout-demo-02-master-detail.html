<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Layout Demo 02 - Master Detail 双栏型</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#f3efe8;color:#2e251d}.app{display:flex;flex-direction:column;height:100vh}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#f7f3ec;border-bottom:1px solid rgba(60,40,20,.08)}.brand{font-weight:700;font-size:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid rgba(60,40,20,.1);border-radius:10px;padding:8px 12px;background:#ece3d6;color:#3a2a1c;font-size:13px;cursor:pointer}.btn.primary{background:#647d6f;color:#fff;border-color:transparent}.main{display:grid;grid-template-columns:420px 1fr;flex:1;min-height:0}.sidebar{border-right:1px solid rgba(60,40,20,.08);background:#f5f1e9;display:flex;flex-direction:column;min-height:0}.content{display:flex;flex-direction:column;min-height:0}.section{padding:14px 16px;border-bottom:1px solid rgba(60,40,20,.08)}.section h3{margin:0 0 10px;font-size:13px;color:#78685a}.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(60,40,20,.12);background:#fff;color:#2e251d}.wb-row,.entry-row{padding:12px 14px;border-radius:12px;background:#fff;border:1px solid rgba(60,40,20,.08);margin-bottom:8px;cursor:pointer}.entry-row.active,.wb-row.active{outline:2px solid #647d6f;background:#fbfaf6}.meta{font-size:12px;color:#7a6959;margin-top:6px}.stack{overflow:auto;flex:1;padding:14px}.editor{padding:20px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.label{font-size:12px;color:#7a6959}.input,.select,.textarea{padding:10px 12px;border-radius:10px;border:1px solid rgba(60,40,20,.12);background:#fff;color:#2e251d}.textarea{min-height:220px;resize:vertical}.subbar{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(60,40,20,.08);background:#faf6ee;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#ece3d6;font-size:12px;color:#5e4c3d;cursor:pointer}.pill.active{background:#647d6f;color:#fff}.footer{height:42px;border-top:1px solid rgba(60,40,20,.08);padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#7a6959;background:#f7f3ec}@media (max-width:960px){.main{grid-template-columns:1fr}.editor{grid-template-columns:1fr}.topbar{height:auto;padding:12px;flex-direction:column;align-items:flex-start;gap:10px}.toolbar{width:100%}}</style></head><body><div class="app"><div class="topbar"><div class="brand">Layout 02 · Master-Detail 双栏型</div><div class="toolbar"><button class="btn primary">💾 保存</button><button class="btn">🔄 刷新</button><button class="btn">🎨 主题</button><button class="btn">⛶ 全屏</button></div></div><div class="main"><aside class="sidebar"><div class="section"><h3>世界书</h3><input class="search" placeholder="搜索世界书..." /><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><span class="pill">📥 导入</span><span class="pill">📤 导出</span><span class="pill">📋 复制</span><span class="pill">✏️ 改名</span><span class="pill">🗑️ 删除</span></div></div><div class="stack"><div class="wb-row active" data-wb="无职转生 v2.0"><strong>无职转生 v2.0</strong></div><div class="wb-row" data-wb="实教 v2.6"><strong>实教 v2.6</strong></div><div class="section" style="margin:12px -14px 0;padding:12px 14px;background:transparent;border:none"><h3>条目列表</h3></div><div class="entry-row active" data-title="格式"><strong>[0] 格式</strong><div class="meta">🔵 常量 · Order 2</div></div><div class="entry-row" data-title="AI_guide"><strong>[1] AI_guide</strong><div class="meta">🔵 常量 · Order 3</div></div><div class="entry-row" data-title="时间&地点"><strong>[2] 时间&地点</strong><div class="meta">🔵 常量 · Order 5</div></div></div></aside><main class="content"><div class="subbar" id="bar"><span class="pill active">自定义排序</span><span class="pill">优先级</span><span class="pill">UID 重排</span><span class="pill">批量移动</span><span class="pill">复制选中</span></div><div class="editor"><div class="field"><div class="label">UID</div><input class="input" id="uid" value="0"></div><div class="field"><div class="label">Order</div><input class="input" id="order" value="2"></div><div class="field full"><div class="label">标题</div><input class="input" id="title" value="格式"></div><div class="field"><div class="label">策略</div><select class="select" id="strategy"><option>🔵 常量</option></select></div><div class="field"><div class="label">位置</div><select class="select"><option>固定深度</option></select></div><div class="field full"><div class="label">正文</div><textarea class="textarea" id="content">双栏型会更稳，左边是管理+列表，右边只专注编辑。</textarea></div></div></main></div><div class="footer"><span id="status">优点：最稳妥、最容易正式落地、电脑手机都好适配</span><span id="hint">点击世界书/条目/胶囊按钮</span></div></div><script>const map={'格式':[0,2,'格式','双栏型会更稳，左边是管理+列表，右边只专注编辑。'],'AI_guide':[1,3,'AI_guide','AI 指引条目示例。'],'时间&地点':[2,5,'时间&地点','时间与地点状态栏条目示例。']};document.querySelectorAll('.wb-row').forEach(el=>el.onclick=()=>{document.querySelectorAll('.wb-row').forEach(n=>n.classList.remove('active'));el.classList.add('active');status.textContent='当前世界书：'+el.dataset.wb;});document.querySelectorAll('.entry-row').forEach(el=>el.onclick=()=>{document.querySelectorAll('.entry-row').forEach(n=>n.classList.remove('active'));el.classList.add('active');const d=map[el.dataset.title];uid.value=d[0];order.value=d[1];title.value=d[2];content.value=d[3];status.textContent='当前条目：'+d[2];});document.querySelectorAll('#bar .pill,.toolbar .btn,.section .pill').forEach(el=>el.onclick=()=>{document.querySelectorAll('#bar .pill').forEach(n=>n.classList.remove('active')); if(el.parentElement&&el.parentElement.id==='bar') el.classList.add('active'); hint.textContent='已点击：'+el.textContent;});</script></body></html>
