<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Layout Demo 04 - Card Studio 卡片工作台</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#f6f1e9;color:#2f261f}.app{display:flex;flex-direction:column;min-height:100vh}.hero{padding:22px 24px;background:linear-gradient(135deg,#ece2d4 0%,#e3d7c7 100%);border-bottom:1px solid rgba(60,40,20,.08)}.hero h1{margin:0;font-size:26px}.hero p{margin:8px 0 0;color:#6f5f50}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid rgba(60,40,20,.1);border-radius:12px;padding:9px 14px;background:#f6efe4;color:#3a2a1c;font-size:13px;cursor:pointer}.btn.primary{background:#7b6d89;color:#fff;border-color:transparent}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:18px;min-height:0}.panel{background:#fbf8f3;border:1px solid rgba(60,40,20,.08);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:0}.panel-head{padding:14px 16px;border-bottom:1px solid rgba(60,40,20,.08);font-weight:700}.panel-body{padding:14px;overflow:auto;flex:1}.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(60,40,20,.12);background:#fff;color:#2f261f}.wb-card,.entry-card{border:1px solid rgba(60,40,20,.08);border-radius:14px;background:#fff;padding:12px 14px;margin-top:10px;cursor:pointer}.entry-card.active,.wb-card.active{outline:2px solid #8e7c96}.entry-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tag{padding:5px 9px;border-radius:999px;background:#f0e8db;font-size:12px;color:#7a695a;cursor:pointer}.tag.active{background:#7b6d89;color:#fff}.workspace{display:grid;grid-template-rows:auto 1fr;gap:14px}.action-card{background:#fbf8f3;border:1px solid rgba(60,40,20,.08);border-radius:18px;padding:14px 16px}.action-groups{display:flex;gap:14px;flex-wrap:wrap}.action-col{display:flex;flex-direction:column;gap:8px;min-width:160px}.action-col h4{margin:0 0 4px;font-size:12px;color:#7b6a5d}.editor-card{background:#fbf8f3;border:1px solid rgba(60,40,20,.08);border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.label{font-size:12px;color:#7b6a5d}.input,.select,.textarea{padding:10px 12px;border-radius:10px;border:1px solid rgba(60,40,20,.12);background:#fff;color:#2f261f}.textarea{min-height:240px;resize:vertical}@media (max-width:960px){.grid{grid-template-columns:1fr}.editor-card{grid-template-columns:1fr}}</style></head><body><div class="app"><section class="hero"><h1>Layout 04 · Card Studio 卡片工作台</h1><p>把所有操作拆成几个“功能卡片”，视觉更像产品而不是控制台。</p><div class="toolbar"><button class="btn primary">💾 保存</button><button class="btn">🔄 刷新</button><button class="btn">🎨 主题</button><button class="btn">⛶ 全屏</button></div></section><div class="grid"><aside class="panel"><div class="panel-head">世界书</div><div class="panel-body"><input class="search" placeholder="搜索世界书..." /><div class="wb-card active" data-wb="无职转生 v2.0"><strong>无职转生 v2.0</strong><div class="entry-tags"><span class="tag">📥 导入</span><span class="tag">📤 导出</span><span class="tag">📋 复制</span><span class="tag">✏️ 改名</span><span class="tag">🗑️ 删除</span></div></div><div class="wb-card" data-wb="实教 v2.6"><strong>实教 v2.6</strong></div></div></aside><main class="workspace"><section class="action-card"><div class="action-groups" id="actions"><div class="action-col"><h4>选择</h4><button class="btn">🔵 常量</button><button class="btn">🟢 可选</button><button class="btn">🔤 关键字</button></div><div class="action-col"><h4>创建</h4><button class="btn">＋ 新建</button><button class="btn">＋＋ 批量</button><button class="btn">📋 复制选中</button></div><div class="action-col"><h4>排序</h4><button class="btn">自定义</button><button class="btn">优先级</button><button class="btn">按当前顺序重排 UID</button></div><div class="action-col"><h4>移动</h4><button class="btn">⬆ 上移</button><button class="btn">⬇ 下移</button><button class="btn">↩ 回退</button></div></div></section><section class="editor-card"><div class="field"><div class="label">UID</div><input class="input" id="uid" value="0"></div><div class="field"><div class="label">Order</div><input class="input" id="order" value="2"></div><div class="field full"><div class="label">标题</div><input class="input" id="title" value="格式"></div><div class="field full"><div class="label">条目列表（卡片展示）</div><div class="wb-card entry-card active" data-title="格式"><strong>[0] 格式</strong><div class="entry-tags"><span class="tag">🔵 常量</span><span class="tag">Order 2</span><span class="tag">固定深度</span></div></div><div class="wb-card entry-card" data-title="AI_guide"><strong>[1] AI_guide</strong><div class="entry-tags"><span class="tag">🔵 常量</span><span class="tag">Order 3</span><span class="tag">固定深度</span></div></div></div><div class="field full"><div class="label">正文</div><textarea class="textarea" id="content">Card Studio 更像“工作台”。
优点是视觉更温和、更产品化，不像现在那么“命令面板感”。</textarea></div></section></main></div></div><script>const map={'格式':[0,2,'格式','Card Studio 更像“工作台”。\n优点是视觉更温和、更产品化，不像现在那么“命令面板感”。'],'AI_guide':[1,3,'AI_guide','AI 指引条目示例。']};document.querySelectorAll('.wb-card[data-wb]').forEach(el=>el.onclick=()=>{document.querySelectorAll('.wb-card[data-wb]').forEach(n=>n.classList.remove('active'));el.classList.add('active');});document.querySelectorAll('.entry-card[data-title]').forEach(el=>el.onclick=()=>{document.querySelectorAll('.entry-card[data-title]').forEach(n=>n.classList.remove('active'));el.classList.add('active');const d=map[el.dataset.title];uid.value=d[0];order.value=d[1];title.value=d[2];content.value=d[3];});document.querySelectorAll('.toolbar .btn,.tag,#actions .btn').forEach(el=>el.onclick=()=>{if(el.classList.contains('tag')){el.classList.toggle('active')}});</script></body></html>
