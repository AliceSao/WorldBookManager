<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>二次筛选 01 - 和风浅色</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f5f3ee;color:#222}.wrap{max-width:1280px;margin:0 auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{border-radius:18px;overflow:hidden;border:1px solid rgba(0,0,0,.08);box-shadow:0 8px 24px rgba(0,0,0,.06);background:var(--bg)}.head{padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--text);font-weight:700}.body{padding:16px;color:var(--text)}.meta{font-size:12px;color:var(--text2);line-height:1.7}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.sw{height:42px;border-radius:10px;border:1px solid rgba(0,0,0,.08)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:6px 10px;border-radius:999px;background:var(--tag);color:var(--text2);font-size:12px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-size:13px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);margin-top:12px}</style></head><body><div class="wrap"><h1>二次筛选 01：和风浅色组</h1><p>主体：青墨染 + 纸窗清影。融合茶白雾青、枯山水、藤灰的柔和灰度。</p><div class="grid">
<section class="card" style="--bg:#f4f0e7;--surface:#e6ddd0;--surface2:#d4c7b4;--text:#2f251c;--text2:#6d5f51;--accent:#5f7b6c;--accentText:#f7f5ef;--btn:#ebe2d4;--tag:#e0d6c8;--input:#faf7f1;--border:rgba(65,54,44,.12)"><div class="head">A1 青墨染·雾笺</div><div class="body"><div class="meta">保留青墨染的温润青绿，把纸窗清影的通透感和茶白雾青的低对比合进去，更适合长时间编辑。</div><div class="chips"><span class="chip">浅色</span><span class="chip">和风</span><span class="chip">青绿</span></div><div class="swatches"><div class="sw" style="background:#f4f0e7"></div><div class="sw" style="background:#e6ddd0"></div><div class="sw" style="background:#5f7b6c"></div><div class="sw" style="background:#2f251c"></div><div class="sw" style="background:#d4c7b4"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#eef3ee;--surface:#dfe7df;--surface2:#cad6ce;--text:#263129;--text2:#617068;--accent:#688676;--accentText:#ffffff;--btn:#e4ece5;--tag:#d7e0d9;--input:#f6faf7;--border:rgba(50,65,54,.12)"><div class="head">A2 纸窗清影·藤露</div><div class="body"><div class="meta">以纸窗清影为核心，加入一点藤灰的灰紫降饱和，让整个绿色系更安静，减少“青过头”的生硬感。</div><div class="chips"><span class="chip">纸窗</span><span class="chip">清透</span><span class="chip">灰绿</span></div><div class="swatches"><div class="sw" style="background:#eef3ee"></div><div class="sw" style="background:#dfe7df"></div><div class="sw" style="background:#688676"></div><div class="sw" style="background:#263129"></div><div class="sw" style="background:#cad6ce"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
</div></div></body></html>
