<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>二次筛选 05 - 混合实验</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#15171b;color:#e2e6ec}.wrap{max-width:1280px;margin:0 auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px rgba(0,0,0,.38);background:var(--bg)}.head{padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--text);font-weight:700}.body{padding:16px;color:var(--text)}.meta{font-size:12px;color:var(--text2);line-height:1.7}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.sw{height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:6px 10px;border-radius:999px;background:var(--tag);color:var(--text2);font-size:12px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-size:13px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);margin-top:12px}</style></head><body><div class="wrap"><h1>二次筛选 05：混合实验组</h1><p>主体：月白金 + 寒川银。融合葡萄灰、石墨青、乌木红的控制感。</p><div class="grid">
<section class="card" style="--bg:#f2efe9;--surface:#e7ded4;--surface2:#d7cdc0;--text:#2d2824;--text2:#70665d;--accent:#8f7f9b;--accentText:#ffffff;--btn:#ece3d8;--tag:#e2d8cc;--input:#faf7f2;--border:rgba(68,58,52,.12)"><div class="head">E1 月白金·葡萄灰</div><div class="body"><div class="meta">以月白金的浅底为主，融入一点葡萄灰，让它从“普通米白”变得更有气质。</div><div class="chips"><span class="chip">月白</span><span class="chip">灰紫</span><span class="chip">高级感</span></div><div class="swatches"><div class="sw" style="background:#f2efe9"></div><div class="sw" style="background:#e7ded4"></div><div class="sw" style="background:#8f7f9b"></div><div class="sw" style="background:#2d2824"></div><div class="sw" style="background:#d7cdc0"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
<section class="card" style="--bg:#11161a;--surface:#182128;--surface2:#22303a;--text:#e0e8ec;--text2:#a5b6be;--accent:#9aaab8;--accentText:#10161a;--btn:#162026;--tag:#1f2a31;--input:#131b20;--border:rgba(154,170,184,.16)"><div class="head">E2 寒川银·石墨</div><div class="body"><div class="meta">寒川银为主，吸收石墨青的克制感，做出更“编辑器化”的中性深色方向。</div><div class="chips"><span class="chip">银灰</span><span class="chip">石墨</span><span class="chip">中性</span></div><div class="swatches"><div class="sw" style="background:#11161a"></div><div class="sw" style="background:#182128"></div><div class="sw" style="background:#9aaab8"></div><div class="sw" style="background:#e0e8ec"></div><div class="sw" style="background:#22303a"></div></div><div class="btns"><button class="btn primary">主按钮</button><button class="btn">次按钮</button></div><input class="input" value="输入框预览" /></div></section>
</div></div></body></html>
